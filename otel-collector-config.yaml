receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 1. Scrub sensitive PII attributes before exporting
  attributes/scrub_pii:
    actions:
      # Overwrite the credit card number with [REDACTED]
      - key: app.payment.card_number
        value: "[REDACTED-BY-COLLECTOR]"
        action: update
      # Bonus: Stamp every trace with an environment attribute
      - key: deployment.environment
        value: "local-dev-lab"
        action: insert

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true
  otlphttp/grafanacloud:
    endpoint: "${env:GRAFANA_CLOUD_OTLP_ENDPOINT}"
    headers:
      "Authorization": "Basic ${env:GRAFANA_CLOUD_BASIC_AUTH}"
  otlp_http/honeycomb:
    endpoint: "https://api.honeycomb.io"
    headers:
      "x-honeycomb-team": "hcaik_01m6xsmdhdrkqfkmawcbhb80r7hr4tpqpc4aqskwsx67ws4vd6c9yhwdbb"

service:
  pipelines:
    traces:
      receivers: [otlp]
      # 2. Register attributes/scrub_pii in the traces pipeline!
      processors: [attributes/scrub_pii, batch]
      exporters: [debug, otlp/lgtm, otlphttp/grafanacloud, otlp_http/honeycomb]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm, otlphttp/grafanacloud, otlp_http/honeycomb]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/lgtm, otlphttp/grafanacloud, otlp_http/honeycomb]